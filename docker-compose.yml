version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: satisfaction_survey_mysql
    environment:
      MYSQL_DATABASE: satisfaction_survey
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: survey_user
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - survey_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Laravel API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satisfaction_survey_api
    environment:
      APP_NAME: "Satisfaction Survey"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: satisfaction_survey
      DB_USERNAME: survey_user
      DB_PASSWORD: password
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - survey_network
    command: >
      sh -c "composer install &&
      php artisan key:generate &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0"

  # Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satisfaction_survey_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    networks:
      - survey_network
    command: npm run dev

  # PhpMyAdmin (optional)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: satisfaction_survey_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: survey_user
      PMA_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - survey_network

volumes:
  mysql_data:

networks:
  survey_network:
    driver: bridge
